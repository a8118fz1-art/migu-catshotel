<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>咪谷貓旅館 | 專業貓咪住宿服務</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Heroicons 用於官方 icon -->
    <script src="https://unpkg.com/heroicons@2.0.18/24/outline/index.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fef3c7 50%, #fff7ed 100%);
            min-height: 100vh;
        }
        .tech-gradient {
            background: linear-gradient(135deg, #fbcfe8 0%, #fed7aa 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 3px solid #fbcfe8;
            border-radius: 2rem;
        }
        .glow {
            box-shadow: 0 8px 32px rgba(251, 207, 232, 0.4);
        }
        .paw-print {
            content: '🐾';
        }
        .cat-emoji {
            font-size: 1.5em;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen flex items-center justify-center p-6">

    <!-- 背景裝飾 -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-pink-200/40 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-amber-200/40 blur-[120px]"></div>
        <div class="absolute top-[20%] right-[10%] w-[20%] h-[20%] rounded-full bg-yellow-100/60 blur-[80px]"></div>
    </div>

    <main class="max-w-md w-full">
        <div class="glass-card rounded-3xl p-8 text-center shadow-2xl glow relative overflow-hidden">
            
            <!-- 裝飾性貓咪圖案 -->
            <div class="absolute top-4 left-4 text-2xl float-animation">🐱</div>
            <div class="absolute bottom-4 right-4 text-2xl float-animation" style="animation-delay: 1s;">🐾</div>
            <div class="absolute top-1/2 left-[-20px] text-xl float-animation" style="animation-delay: 0.5s;">🌸</div>
            
            <!-- 飯店頭像 -->
            <div class="relative mx-auto mb-6">
                <div class="w-32 h-32 mx-auto mb-4 object-cover rounded-full border-4 border-pink-300 overflow-hidden shadow-lg">
                    <img src="images.jfif" alt="咪谷貓旅館" class="w-full h-full object-cover">
                </div>
                <div class="absolute -bottom-2 -right-2 bg-white rounded-full p-2 shadow-md">
                    <span class="text-2xl">🐱</span>
                </div>
            </div>

            <!-- 飯店名稱與簡介 -->
            <h1 class="text-3xl font-bold text-black mb-2 tracking-tight">
                咪谷貓旅館
            </h1>
            <p class="text-amber-600 font-medium mb-4 text-center text-xl font-bold">
                貓咪的第二個家
            </p>
            <p class="text-slate-600 text-sm leading-relaxed mb-8">
                位於台中市西區的貓咪住宿照顧。我們提供舒適且充滿愛的環境，讓您的愛貓在咪谷時，也能享受如家一般的放鬆與照護
            </p>

            <!-- 服務特色標籤 -->
            <div class="flex flex-wrap justify-center gap-2 mb-10">
                <span class="px-4 py-2 text-xs font-semibold rounded-full bg-pink-100 text-pink-700 shadow-sm">
                    <span class="text-sm mr-1">#</span>
                    貓咪住宿
                </span>
                <span class="px-4 py-2 text-xs font-semibold rounded-full bg-amber-100 text-amber-700 shadow-sm">
                    <span class="text-sm mr-1">#</span>
                    專業照護
                </span>
                <span class="px-4 py-2 text-xs font-semibold rounded-full bg-pink-100 text-pink-700 shadow-sm">
                    <span class="text-sm mr-1">#</span>
                    舒適環境
                </span>
                <span class="px-4 py-2 text-xs font-semibold rounded-full bg-amber-100 text-amber-700 shadow-sm">
                    <span class="text-sm mr-1">#</span>
                    遊戲娛樂
                </span>
            </div>

            <!-- 聯繫按鈕 -->
            <div class="space-y-4">
                <a href="https://line.me/ti/p/@migucathotel" class="block w-full py-4 px-6 bg-[#06C755] text-white font-bold rounded-2xl transition-transform hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-green-200 flex items-center justify-center gap-2">
                    <!-- LINE 官方 icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                    </svg>
                    透過 LINE 預定或詢問
                </a>
                <a href="https://www.instagram.com/migu_catshotel" class="block w-full py-4 px-6 bg-gradient-to-r from-pink-500 to-amber-500 text-white font-semibold rounded-2xl border-2 border-pink-300 transition-all hover:shadow-lg hover:shadow-pink-200 flex items-center justify-center gap-2">
                    <!-- Instagram 官方 icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Instagram 關注我們
                </a>
                <div class="text-center">
                    <span class="text-sm font-semibold">📞 電話：0965409861</span>
                </div>
            </div>

            <!-- 底部裝飾 -->
            <div class="mt-6 flex justify-center gap-4 text-2xl">
                <span class="float-animation">🌸</span>
                <span class="float-animation" style="animation-delay: 0.5s;">🐾</span>
                <span class="float-animation" style="animation-delay: 1s;">🌸</span>
            </div>

        </div>

        <!-- 頁尾 -->
        <footer class="mt-8 text-center text-slate-500 text-xs">
            <div class="flex items-center justify-center gap-2 mb-2">
                <span class="text-lg">🐱</span>
                <span>&copy; 2026 咪谷貓旅館</span>
                <span class="text-lg">🐱</span>
            </div>
            <div class="flex items-center justify-center gap-4">
                <span class="text-sm">🐾 溫暖陪伴</span>
                <span class="text-sm">🌸 專業照護</span>
                <span class="text-sm">💖 愛心滿滿</span>
            </div>
        </footer>
    </main>

</body>
</html>
